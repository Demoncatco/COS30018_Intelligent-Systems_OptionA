# Lint rules for `ruff check .` (also run in CI). Kept small so it flags real bugs, not style.
line-length = 120
target-version = "py310"
extend-exclude = ["agents/diagnostic_agent/extract_knee_findings.py"]  # standalone script, not imported

[lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]  # syntax, pyflakes (unused/undefined/redefined names), mutable defaults