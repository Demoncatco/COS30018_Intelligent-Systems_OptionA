<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knee MRI Agentic System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Knee MRI Agentic System</h1>
            <p>Multi-Agent Medical Analysis Platform</p>
        </header>

        <!-- Task Submission -->
        <section class="card">
            <h2>Submit a Task</h2>

            <label for="task">Enter task or upload study:</label>

            <textarea id="task"
                placeholder="Enter information for analysis..."></textarea>

            <div class="upload">
                <input type="file" id="file">
            </div>

            <button id="submitBtn">Submit Analysis</button>
        </section>


        <!-- Agent Status -->
        <section class="card">
            <h2>Agent Status</h2>

            <div class="agent-status" id="inputStatus">
                <span class="dot waiting"></span>
                Input Received
            </div>

            <div class="agent-status" id="diagnosticStatus">
                <span class="dot waiting"></span>
                Diagnostic Agent
            </div>

            <div class="agent-status" id="coordinatorStatus">
                <span class="dot waiting"></span>
                Coordinator Agent
            </div>

            <div class="agent-status" id="recommendationStatus">
                <span class="dot waiting"></span>
                Recommendation Agent
            </div>

            <div class="agent-status" id="resultStatus">
                <span class="dot waiting"></span>
                Result Generation
            </div>
        </section>


        <!-- Final Result -->
        <section class="card">
            <h2>Analysis Result</h2>

            <div class="result" id="result">
                <h3>System Output</h3>

                <p class="placeholder">
                    Waiting for system results...
                </p>
            </div>
        </section>


        <!-- Error State -->
        <section class="error-card" id="errorBox">
            <h3>Error / Inconclusive State</h3>

            <p id="errorMessage">
                No errors detected.
            </p>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
